name: shashinmori_app
description: 'ShashinMori family photo dashboard'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.1
  google_sign_in: ^7.2.0

  go_router: ^16.2.4
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  dio: ^5.9.0
  tus_client_dart: ^2.5.0

  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.3.1
  flutter_svg: ^2.0.17
  gap: ^3.0.1

  image_picker: ^1.2.0
  file_picker: ^10.3.2
  intl: ^0.20.2
  path: ^1.9.1
  cross_file: ^0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
